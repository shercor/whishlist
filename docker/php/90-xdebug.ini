; Xdebug queda instalado pero APAGADO por defecto (mode=off) para no penalizar
; el rendimiento en el día a día.
;
; Para depurar, cambia a: xdebug.mode=develop,debug  y reinicia el contenedor:
;   docker compose restart app
;
; Config de VS Code (.vscode/launch.json):
;   { "name": "Listen for Xdebug", "type": "php", "request": "launch", "port": 9003,
;     "pathMappings": { "/var/www": "${workspaceFolder}/laravel" } }
zend_extension=xdebug
xdebug.mode=off
xdebug.start_with_request=yes
xdebug.client_host=host.docker.internal
xdebug.client_port=9003
xdebug.discover_client_host=0
