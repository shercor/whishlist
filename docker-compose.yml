# app, scheduler y queue comparten imagen, código y dependencias; solo cambia el comando.
x-php: &php
  build:
    context: ./docker/php
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  restart: unless-stopped
  working_dir: /var/www
  volumes:
    - ./laravel:/var/www
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  app:
    <<: *php
    container_name: "${APP_NAME}_app"
    ports:
      # Vite dev server
      - "${VITE_PORT}:5173"
    extra_hosts:
      # Permite que Xdebug encuentre al IDE del host en Linux.
      - "host.docker.internal:host-gateway"

  # Sin este servicio, lo programado en routes/console.php nunca corre: las
  # reservas vencidas no se liberarían jamás.
  scheduler:
    <<: *php
    container_name: "${APP_NAME}_scheduler"
    command: php artisan schedule:work

  # Ejecuta los jobs encolados (hoy, achicar las fotos recién subidas). Los
  # topes evitan que un job roto reintente para siempre y reciclan el proceso
  # cada hora. Carga el código una vez: tras cambiar un job, make queue-restart.
  queue:
    <<: *php
    container_name: "${APP_NAME}_queue"
    command: php artisan queue:work --tries=3 --max-time=3600

  webserver:
    image: nginx:stable-alpine
    container_name: "${APP_NAME}_webserver"
    restart: unless-stopped
    volumes:
      - ./laravel:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_PORT}:80"
    depends_on:
      - app

  # App Angular + Ionic con ng serve; recarga sola al guardar. Usa el mismo
  # app/node_modules que el host, así el editor y los tests ven las mismas
  # dependencias.
  web:
    image: node:24-slim
    container_name: "${APP_NAME}_web"
    restart: unless-stopped
    # Sin esto, `make down` espera 10 s: sh no le pasa la señal de parada a ng serve.
    init: true
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    environment:
      # npm necesita un HOME escribible aunque el UID no exista en la imagen.
      HOME: /tmp
    volumes:
      - ./app:/app
    # npm install tarda segundos si no cambió package-lock.json.
    command: sh -c "npm install --no-audit --no-fund && npm start -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:${WEB_PORT:-4202}:4200"

  db:
    image: mariadb:11.4
    container_name: "${APP_NAME}_db"
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: "${DB_DATABASE}"
      MARIADB_USER: "${DB_USERNAME}"
      MARIADB_PASSWORD: "${DB_PASSWORD}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    volumes:
      # Volumen con nombre (no bind mount): evita los problemas de permisos
      # y de "no puedo borrar docker/dbdata sin sudo".
      - dbdata:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      # Solo se ejecuta al crear el volumen por primera vez.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Sin el 127.0.0.1 delante, Docker publica en 0.0.0.0 y la base queda
      # alcanzable desde toda la red local (y ufw no lo bloquea, porque el
      # tráfico va por FORWARD y no por INPUT). Te conectas igual con
      # localhost:${DB_PORT} desde el host.
      - "127.0.0.1:${DB_PORT}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: "${APP_NAME}_redis"
    restart: unless-stopped
    volumes:
      - redisdata:/data
    ports:
      # Solo accesible desde esta máquina, igual que db.
      - "127.0.0.1:${REDIS_PORT}:6379"

volumes:
  dbdata:
  redisdata:
