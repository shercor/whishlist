services:
  app:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: "${APP_NAME}_app"
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./laravel:/var/www
    ports:
      # Vite dev server
      - "${VITE_PORT}:5173"
    extra_hosts:
      # Permite que Xdebug encuentre al IDE del host en Linux.
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Sin este servicio, todo lo que se programe en routes/console.php queda
  # escrito pero nunca corre: las reservas vencidas no se liberarían jamás.
  # schedule:work es el equivalente a la línea de cron, pero en primer plano,
  # que es lo que un contenedor necesita.
  scheduler:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: "${APP_NAME}_scheduler"
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan schedule:work
    volumes:
      - ./laravel:/var/www
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # El que saca de la cola lo que la aplicación deja encolado —hoy, achicar las
  # fotos recién subidas—. Sin este servicio los jobs se apilan en redis y no
  # los ejecuta nadie: no hay error, simplemente la foto nunca se achica. Es el
  # mismo agujero que tenía el scheduler.
  #
  # --tries=3 y --max-time=3600 a propósito: los reintentos los decide cada
  # job, pero un tope global evita que un job roto reintente para siempre, y
  # reciclar el proceso cada hora corta las fugas de memoria de un worker que
  # lleva días vivo. Al salir, restart: unless-stopped lo vuelve a levantar.
  #
  # OJO: el worker carga el código una vez y se lo queda. Después de cambiar un
  # job hay que reiniciarlo (`make queue-restart`), o seguirá corriendo el
  # anterior.
  queue:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: "${APP_NAME}_queue"
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --tries=3 --max-time=3600
    volumes:
      - ./laravel:/var/www
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  webserver:
    image: nginx:stable-alpine
    container_name: "${APP_NAME}_webserver"
    restart: unless-stopped
    volumes:
      - ./laravel:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_PORT}:80"
    depends_on:
      - app

  db:
    image: mariadb:11.4
    container_name: "${APP_NAME}_db"
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: "${DB_DATABASE}"
      MARIADB_USER: "${DB_USERNAME}"
      MARIADB_PASSWORD: "${DB_PASSWORD}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    volumes:
      # Volumen con nombre (no bind mount): evita los problemas de permisos
      # y de "no puedo borrar docker/dbdata sin sudo".
      - dbdata:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      # Solo se ejecuta al crear el volumen por primera vez.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Sin el 127.0.0.1 delante, Docker publica en 0.0.0.0 y la base queda
      # alcanzable desde toda la red local (y ufw no lo bloquea, porque el
      # tráfico va por FORWARD y no por INPUT). Te conectas igual con
      # localhost:${DB_PORT} desde el host.
      - "127.0.0.1:${DB_PORT}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: "${APP_NAME}_redis"
    restart: unless-stopped
    volumes:
      - redisdata:/data
    ports:
      # Solo accesible desde esta máquina, igual que db.
      - "127.0.0.1:${REDIS_PORT}:6379"

volumes:
  dbdata:
  redisdata:
