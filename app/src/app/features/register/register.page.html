<ion-content class="gift-background ion-padding">
  <app-theme-toggle class="theme-corner" />

  <main class="login">
    <!--
      Cabecera anterior: el regalo en un recuadro. Guardada por si se vuelve a ella; para usarla,
      descomentarla, quitar el <img> con el logo de abajo y devolver a register.page.ts el import
      de IonIcon y addIcons({ giftOutline }).
      <div
        aria-hidden="true"
        class="icon-float mb-2 flex size-16 items-center justify-center rounded-2xl bg-amber-50 text-3xl text-amber-700 shadow-sm dark:bg-amber-500/15 dark:text-amber-300"
      >
        <ion-icon name="gift-outline" />
      </div>
    -->
    <!-- El logo, igual que en la pantalla de entrar (los estilos son los de login.page.scss). -->
    <img
      class="login-logo enter-up"
      style="--i: 1"
      [src]="theme.isDark() ? 'logo-wishlist-sobre-oscuro.png' : 'logo-wishlist-sobre-claro.png'"
      alt="wishlist"
    />
    <h1 class="enter-up" style="--i: 2">Crea tu cuenta</h1>
    <p class="enter-up" style="--i: 3">Arma tus listas y regala sin repetir.</p>

    <form
      class="card enter-up flex w-full flex-col gap-4 p-4 text-left md:p-5"
      style="--i: 5"
      (submit)="submit($event)"
    >
      <label class="flex flex-col gap-1.5 text-sm font-medium">
        Tu nombre
        <input
          type="text"
          class="control w-full"
          maxlength="255"
          autocomplete="name"
          enterkeyhint="next"
          required
          [value]="name()"
          (input)="name.set(valueOf($event))"
        />
      </label>
      <label class="flex flex-col gap-1.5 text-sm font-medium">
        Tu usuario
        <input
          type="text"
          class="control w-full"
          maxlength="30"
          autocapitalize="none"
          autocomplete="username"
          spellcheck="false"
          enterkeyhint="next"
          placeholder="ana_rojas"
          required
          [value]="username()"
          (input)="username.set(valueOf($event))"
        />
        <span class="hint font-normal">
          Es lo único por lo que te pueden buscar. Letras, números o guion bajo.
        </span>
      </label>
      <label class="flex flex-col gap-1.5 text-sm font-medium">
        Correo
        <input
          type="email"
          class="control w-full"
          autocomplete="email"
          enterkeyhint="next"
          required
          [value]="email()"
          (input)="email.set(valueOf($event))"
        />
        <span class="hint font-normal">No lo ve nadie más.</span>
      </label>
      <label class="flex flex-col gap-1.5 text-sm font-medium">
        Contraseña
        <input
          type="password"
          class="control w-full"
          minlength="8"
          autocomplete="new-password"
          enterkeyhint="next"
          required
          [value]="password()"
          (input)="password.set(valueOf($event))"
        />
        <span class="hint font-normal">Al menos 8 caracteres.</span>
      </label>
      <label class="flex flex-col gap-1.5 text-sm font-medium">
        Repite la contraseña
        <input
          type="password"
          class="control w-full"
          autocomplete="new-password"
          enterkeyhint="go"
          required
          [attr.aria-invalid]="mismatch()"
          [value]="confirmation()"
          (input)="confirmation.set(valueOf($event))"
        />
        @if (mismatch()) {
          <span class="text-sm font-normal text-red-600 dark:text-red-400">
            No es igual a la de arriba.
          </span>
        }
      </label>

      @if (error(); as message) {
        <p
          role="alert"
          animate.enter="enter-down"
          class="m-0 text-sm text-red-600 dark:text-red-400"
        >
          {{ message }}
        </p>
      }

      <ion-button type="submit" expand="block" class="pressable m-0" [disabled]="!canSubmit()">
        @if (saving()) {
          <ion-spinner name="crescent" aria-label="Creando la cuenta" />
        } @else {
          Crear cuenta
        }
      </ion-button>
    </form>

    <p class="enter-up m-0 text-sm text-neutral-500 dark:text-neutral-400" style="--i: 6">
      ¿Ya tienes cuenta?
      <a class="font-medium" routerLink="/login" queryParamsHandling="preserve">Entra</a>
    </p>
  </main>
</ion-content>
