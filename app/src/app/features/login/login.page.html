<ion-content class="gift-background ion-padding">
  <app-theme-toggle class="theme-corner" />

  <main class="login">
    <!--
      Cabecera anterior: el regalo en un recuadro y el nombre escrito. Guardada por si se vuelve a
      ella; para usarla, descomentarla, quitar el <h1> con el logo de abajo y devolver a
      login.page.ts el import de IonIcon y addIcons({ giftOutline }).
      <div
        aria-hidden="true"
        class="icon-float mb-2 flex size-16 items-center justify-center rounded-2xl bg-amber-50 text-3xl text-amber-700 shadow-sm dark:bg-amber-500/15 dark:text-amber-300"
      >
        <ion-icon name="gift-outline" />
      </div>
      <h1 class="enter-up" style="--i: 2">whishlist</h1>
    -->
    <!-- El logo, en la versión que se lee sobre el fondo de cada modo (como en el menú lateral). -->
    <h1 class="enter-up" style="--i: 1">
      <img
        class="login-logo"
        [src]="theme.isDark() ? 'logo-wishlist-sobre-oscuro.png' : 'logo-wishlist-sobre-claro.png'"
        alt="wishlist"
      />
    </h1>
    <p class="enter-up" style="--i: 3">Tus listas de deseos, sin arruinar la sorpresa.</p>

    <form
      class="card enter-up flex w-full flex-col gap-4 p-4 text-left md:p-5"
      style="--i: 5"
      (submit)="submit($event)"
    >
      <label class="flex flex-col gap-1.5 text-sm font-medium">
        Correo
        <input
          type="email"
          class="control w-full"
          autocomplete="email"
          enterkeyhint="next"
          required
          [value]="email()"
          (input)="email.set(valueOf($event))"
        />
      </label>
      <label class="flex flex-col gap-1.5 text-sm font-medium">
        Contraseña
        <input
          type="password"
          class="control w-full"
          autocomplete="current-password"
          enterkeyhint="go"
          required
          [value]="password()"
          (input)="password.set(valueOf($event))"
        />
      </label>

      @if (error(); as message) {
        <p
          role="alert"
          animate.enter="enter-down"
          class="m-0 text-sm text-red-600 dark:text-red-400"
        >
          {{ message }}
        </p>
      }

      <ion-button type="submit" expand="block" class="pressable m-0" [disabled]="!canSubmit()">
        @if (signingIn()) {
          <ion-spinner name="crescent" aria-label="Entrando" />
        } @else {
          Entrar
        }
      </ion-button>
    </form>

    <p class="enter-up m-0 text-sm text-neutral-500 dark:text-neutral-400" style="--i: 6">
      ¿No tienes cuenta?
      <a class="font-medium" routerLink="/registro" queryParamsHandling="preserve">Crea una</a>
    </p>
  </main>
</ion-content>
